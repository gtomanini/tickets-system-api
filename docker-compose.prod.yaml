services:
  api:
    image: ghcr.io/gtomanini/tickets-system-api:latest
    container_name: api-tickets
    restart: always
    ports:
      - "8080:8080"
    environment:
      # DB_URL points to the private IP of the MySQL VM
      # e.g. jdbc:mysql://10.0.0.x:3306/tickets
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      # Memory-tuned for 1 GB RAM (AMD micro VM)
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx384m"
